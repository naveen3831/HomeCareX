<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="HomeCareX connects you with trusted professionals for cleaning, plumbing, electrical work, appliance repair, and home maintenance."
    />
    <title>HomeCareX | Professional Home Services</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Home only: start downloading the hero photo before JavaScript runs.
         srcset/sizes match the <picture> in Home.tsx, so the browser reuses this download. -->
    <script>
      (function () {
        if (location.pathname !== "/") return;
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.type = "image/webp";
        l.setAttribute(
          "imagesrcset",
          "/images/background-800.webp 800w, /images/background-1280.webp 1280w, /images/background.webp 1672w"
        );
        l.setAttribute("imagesizes", "100vw");
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);
      })();
    </script>

    <!-- ONE font request for the whole app (DM Sans = header/footer, Manrope + Poppins = pages,
         Bricolage = footer headings). Non-blocking: applied after load, display=swap shows text at once.
         Do not add @import font rules in components. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap"
      />
    </noscript>

    <!-- Instant first screen for the Home page ("/" only): plain HTML + CSS, so the hero photo can paint
         before any JavaScript has loaded. Home.tsx removes it after the real hero image has loaded.
         Keep the heights slightly smaller than the real header. -->
    <style>
      #hcx-shell { z-index: 2147483000; pointer-events: none; background: #eef0ff; position: absolute; top: 0; left: 0; right: 0; }
      #hcx-shell .sp { background: linear-gradient(90deg, #fff, #eef0ff, #fff); height: 64px; }
      #hcx-shell img { object-fit: cover; object-position: right; width: 100%; height: calc(100svh - 64px); display: block; }
      #hcx-shell .ov { background: #ffffffbf; position: absolute; inset: 64px 0 0; }
      @media (min-width: 768px) {
        #hcx-shell .sp { height: 100px; }
        #hcx-shell img { height: calc(100svh - 100px); }
        #hcx-shell .ov { background: linear-gradient(90deg, #ffffffe6, #ffffffa6, #fff0); width: 62%; top: 100px; right: auto; }
      }
    </style>

    <style>
      .boot-loader { display: flex; min-height: 100vh; align-items: center; justify-content: center; gap: 12px; font-family: Poppins, system-ui, sans-serif; font-size: 14px; color: #6b6880; background: #fafaff; }
      .boot-spinner { width: 22px; height: 22px; border: 3px solid #e4e2f0; border-top-color: #4338ca; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>

    <link
  rel="preload"
  as="image"
  href="/images/appliance-repair.webp"
  type="image/webp"
  fetchpriority="high"
/>
  </head>

  <body>
    <div id="root">
      <!-- Shown until the app loads (slow network): React replaces this on mount. -->
      <div role="status" aria-live="polite" class="boot-loader">
        <span class="boot-spinner" aria-hidden="true"></span>
        <span>Loading HomeCareX…</span>
      </div>
      <noscript>HomeCareX needs JavaScript to run. Please enable it and reload.</noscript>
    </div>

    <script>
      /* Home page only: paint the hero photo from plain HTML, on top of the page.
         Home.tsx removes it once React's own hero image has loaded. The timer is a safety net. */
      (function () {
        if (location.pathname !== "/") return;
        document.body.insertAdjacentHTML(
          "beforeend",
          '<div id="hcx-shell" aria-hidden="true">' +
            '<div class="sp"></div>' +
            '<img src="/images/background.webp"' +
            ' srcset="/images/background-800.webp 800w, /images/background-1280.webp 1280w, /images/background.webp 1672w"' +
            ' sizes="100vw" width="1672" height="941" alt=""' +
            ' fetchpriority="high" decoding="async" />' +
            '<div class="ov"></div>' +
            "</div>"
        );
        setTimeout(function () {
          var s = document.getElementById("hcx-shell");
          if (s) s.remove();
        }, 8000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
